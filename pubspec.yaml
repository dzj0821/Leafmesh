name: leafmesh
description: Local-first files and Markdown, powered by Syncthing.
publish_to: none
version: 0.1.8+11
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  file_picker: ^10.3.3
  flutter_inappwebview: ^6.1.5
  http: ^1.4.0
  mobile_scanner: ^7.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  window_manager: ^0.5.1
dependency_overrides:
  flutter_inappwebview_windows:
    path: native/flutter_inappwebview_windows

dev_dependencies:
  flutter_inappwebview_windows: ^0.6.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/editor/
    - assets/core/README.txt
    - assets/core/LICENSE.txt
    - assets/core/AUTHORS.txt
    - assets/core/version.json

